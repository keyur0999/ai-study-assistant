<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Study Assistant</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <span class="logo-icon">🧠</span>
                <h2>AI Study Assistant</h2>
            </div>
            
            <div class="welcome-text">
                <h3>Welcome back</h3>
                <p>Please enter your details to sign in.</p>
            </div>

            <!-- Error message container -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="btn-text">Show</button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember"> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <div class="signup-prompt">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>
            
            <div class="demo-notice">
                <small><strong>Demo Login:</strong> student@example.com / 123456</small>
            </div>
        </div>
    </div>

    <!-- Script loaded at the end of the body -->
    <script src="js/auth.js"></script>
</body>
</html>
